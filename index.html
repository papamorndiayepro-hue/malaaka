<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Papa Mor Ndiaye — Développeur Web</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0e0e;--fg:#fff;--mut:#9a9a9a;--card:#181818;--ac:#ff5a1f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f3f0ec;--fg:#111;--mut:#666;--card:#fff}}
:root[data-theme=dark]{--bg:#0e0e0e;--fg:#fff;--mut:#9a9a9a;--card:#181818}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font:400 16px/1.6 'Plus Jakarta Sans',system-ui,sans-serif;overflow-x:hidden}
nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 5vw 14px;color:#fff;backdrop-filter:blur(8px)}
nav b{font-weight:800;font-size:20px}nav div{display:flex;gap:22px;align-items:center;font-size:14px}nav a{color:inherit;text-decoration:none;opacity:.85}
.btn{display:inline-flex;gap:10px;align-items:center;background:var(--ac);color:#fff!important;border:0;border-radius:40px;padding:10px 12px 10px 22px;font:600 14px inherit;cursor:pointer;text-decoration:none;opacity:1!important}
.btn i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#fff;color:var(--ac);font-style:normal;transition:transform .3s}.btn:hover i{transform:translateX(5px) rotate(-45deg)}
.hero{position:relative;min-height:100vh;border-radius:0 0 56px 56px;padding:120px 5vw 60px;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:end;overflow:hidden;background:radial-gradient(120% 90% at 80% 20%,#ff7a2f,#e8441a 45%,#4a1308 85%);color:#fff;perspective:1200px}
.hero:before{content:"";position:absolute;inset:-30%;background:conic-gradient(from 0deg,transparent,rgba(255,200,120,.25),transparent 40%);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero h1{font-size:clamp(46px,9vw,128px);line-height:.95;font-weight:800;letter-spacing:-2px}.hero small{font-size:22px;font-weight:600;display:block;margin-bottom:12px}
.hero p{max-width:420px;margin-top:22px;opacity:.9}.hero>*{position:relative}
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:16px;margin-top:40px;font-size:14px}.svc span{color:#ffd2b8;display:block;font-weight:600}
.ph{height:min(72vh,640px);border-radius:36px;overflow:hidden;transform-style:preserve-3d;transition:transform .15s;box-shadow:0 40px 80px rgba(0,0,0,.45);justify-self:center;aspect-ratio:.6}
.ph img{width:100%;height:100%;object-fit:cover;animation:kb 14s ease-in-out infinite alternate}@keyframes kb{to{transform:scale(1.12) translateY(-2%)}}
.cube{position:absolute;right:6vw;top:22vh;width:70px;height:70px;transform-style:preserve-3d;animation:cube 12s linear infinite}
.cube i{position:absolute;inset:0;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.08)}
.cube i:nth-child(1){transform:translateZ(35px)}.cube i:nth-child(2){transform:rotateY(180deg) translateZ(35px)}.cube i:nth-child(3){transform:rotateY(90deg) translateZ(35px)}.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(35px)}.cube i:nth-child(5){transform:rotateX(90deg) translateZ(35px)}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(35px)}
@keyframes cube{to{transform:rotateX(360deg) rotateY(720deg)}}
section{padding:90px 5vw}h2{font-size:clamp(30px,5vw,56px);line-height:1.1;font-weight:800;margin:6px 0 18px}.ey{color:var(--ac);font-weight:600}
.about{display:grid;grid-template-columns:1fr 1fr;gap:40px}.about p{font-size:20px}
.ring{height:260px;perspective:1000px;display:grid;place-items:center;overflow:hidden}.rot{position:relative;width:170px;height:60px;transform-style:preserve-3d;animation:rr 22s linear infinite}
.rot span{position:absolute;inset:0;display:grid;place-items:center;background:var(--card);border:1px solid var(--ac);border-radius:14px;font-weight:600}@keyframes rr{to{transform:rotateY(-360deg)}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;perspective:1200px}
.card{background:var(--card);border-radius:28px;overflow:hidden;transition:transform .15s;transform-style:preserve-3d;text-decoration:none;color:inherit;display:block}
.card .im{aspect-ratio:4/5;overflow:hidden;background:linear-gradient(135deg,var(--ac),#2a0f08)}.card img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s}.card:hover img{transform:scale(1.15) rotate(1deg)}
.card div.t{padding:18px 22px 24px}.card p{color:var(--mut);font-size:14px}
.rv{opacity:0;transform:translateY(50px) rotateX(8deg);transition:1s cubic-bezier(.2,.7,.2,1)}.rv.in{opacity:1;transform:none}
footer{padding:60px 5vw;border-radius:56px 56px 0 0;background:var(--card);text-align:center}footer a{color:var(--ac)}
#adm{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 5vw 80px;display:none}#adm.on{display:block}
#adm fieldset{border:1px solid #444;border-radius:14px;padding:12px;margin:10px 0}#adm label{display:block;font-size:12px;color:var(--mut);margin-top:8px}
#adm input,#adm textarea{width:100%;background:var(--card);color:var(--fg);border:1px solid #444;border-radius:10px;padding:9px;font:inherit}
#adm .bar{position:sticky;top:0;display:flex;gap:10px;justify-content:space-between;padding:10px 0;background:var(--bg);z-index:2}
.sm{background:#333;color:#fff;border:0;border-radius:8px;padding:6px 12px;cursor:pointer;margin:6px 6px 0 0}
i.ch{font-style:normal;display:inline-block;opacity:0;transform:translateY(70%) rotateX(-90deg);animation:chin .8s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*38ms);animation-play-state:paused}
.sp.in i.ch{animation-play-state:running}@keyframes chin{to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
nav{animation:dn 1s both}@keyframes dn{from{transform:translateY(-100%)}}
.hero small,.hero p{animation:up 1s .9s both}.svc>div{animation:up .9s both}.svc>div:nth-child(1){animation-delay:1.2s}.svc>div:nth-child(2){animation-delay:1.35s}.svc>div:nth-child(3){animation-delay:1.5s}.svc>div:nth-child(4){animation-delay:1.65s}
.ph{animation:up 1.4s .4s both}.btn{animation:pulse 2.6s infinite}@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(255,90,31,.18)}}
.hero:after{content:"";position:absolute;width:40vw;height:40vw;left:-10vw;bottom:-20vw;border-radius:50%;background:rgba(255,190,120,.25);filter:blur(60px);animation:fl 9s ease-in-out infinite alternate}@keyframes fl{to{transform:translate(12vw,-8vw) scale(1.3)}}
.ey{display:inline-block;animation:sh 3s ease-in-out infinite}@keyframes sh{50%{letter-spacing:3px;opacity:.7}}
.grid>.rv:nth-child(2){transition-delay:.15s}.grid>.rv:nth-child(3){transition-delay:.3s}.grid>.rv:nth-child(4){transition-delay:.45s}
.rot span{animation:glow 3s ease-in-out infinite alternate}@keyframes glow{to{box-shadow:0 0 22px var(--ac)}}
.faq{max-width:900px;margin:0 auto}.fq{background:var(--card);border-radius:22px;margin:14px 0;overflow:hidden;transition:transform .3s,box-shadow .3s}.fq:hover{transform:translateX(8px);box-shadow:0 0 0 1px var(--ac)}
.fq button{all:unset;box-sizing:border-box;width:100%;padding:20px 24px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;gap:16px}
.fq button b{color:var(--ac);font-size:24px;transition:transform .4s}.fq.op button b{transform:rotate(135deg)}
.fq .an{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s}.fq.op .an{grid-template-rows:1fr}.fq .an div{overflow:hidden;color:var(--mut);padding:0 24px}.fq.op .an div{padding-bottom:20px}
.so{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;opacity:1!important;transition:transform .3s}.so:hover{transform:scale(1.2) rotate(8deg)}.so svg{width:20px;height:20px}.so.big{width:56px;height:56px}.so.big svg{width:30px;height:30px}.wa{background:#25D366;color:#fff!important}.sn{background:#FFFC00;color:#000!important}
nav{background:rgba(14,14,14,.55)}
.lgo{width:14px;height:14px;border-radius:50%;background:var(--ac);box-shadow:0 0 18px var(--ac);opacity:1!important}
.nl{font-weight:600}.nl.act{color:var(--ac)!important;opacity:1!important}
main{display:none}main:not([data-pg=accueil]){padding-top:90px;min-height:85vh}
#c3{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}.hero>div{z-index:2}
.giant{position:relative;text-align:center;overflow:hidden;padding:60px 0}.big{font-size:23vw;font-weight:800;letter-spacing:-.06em;line-height:.8;animation:bg 8s ease-in-out infinite alternate}@keyframes bg{to{letter-spacing:-.04em;transform:scale(1.04)}}
.scr{position:absolute;left:50%;top:52%;font:400 10vw 'Mrs Saint Delafield',cursive;color:var(--ac);white-space:nowrap;transform:translate(-50%,-50%) rotate(-5deg);text-shadow:0 4px 30px rgba(0,0,0,.35)}
.strip-w{overflow:hidden;padding:20px 0}.strip{display:flex;gap:18px;width:max-content;animation:mq 40s linear infinite}.strip:hover{animation-play-state:paused}.strip img{height:44vh;border-radius:28px;object-fit:cover}@keyframes mq{to{transform:translateX(-50%)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:30px;margin-top:20px}.stats b{display:block;font-size:clamp(44px,7vw,84px);font-weight:800;line-height:1;border-bottom:1px dashed var(--ac);padding-bottom:12px}.stats p{color:var(--mut);margin-top:10px}
.row{display:grid;grid-template-columns:50px 1fr 1.2fr;gap:20px;align-items:center;padding:34px 0;border-bottom:1px dashed #555;transition:padding .4s,color .3s}.row:hover{padding-left:24px;color:var(--ac)}.row h3{font-size:clamp(24px,4vw,44px);line-height:1.1}.row p{color:var(--mut)}.row span{color:var(--ac);font-size:28px}
.bigc{font-size:clamp(40px,9vw,120px)}.cl{font-size:clamp(20px,3vw,34px);margin:30px 0}.cl a{color:var(--fg);text-decoration:none;border-bottom:2px solid var(--ac)}
.card .im{aspect-ratio:4/3}.card img{object-position:top}
@media(max-width:800px){.hero,.about{grid-template-columns:1fr}.hero{padding-top:100px}.ph{height:50vh}nav div{gap:12px;overflow-x:auto;max-width:80vw;white-space:nowrap}.row{grid-template-columns:30px 1fr}.row p{grid-column:2}}

bigWord:"portfolio",
aboutParas:[B("Je suis Papa Mor Ndiaye, développeur web. Je conçois des sites et des applications qui allient design soigné, performance et facilité d’utilisation.","I’m Papa Mor Ndiaye, a web developer. I build websites and applications that combine polished design, performance and ease of use."),B("Mon approche : comprendre votre activité, proposer une interface claire et animée, puis construire un site solide, avec une base de données et un espace d’administration pour que vous gardiez la main sur votre contenu.","My approach: understand your business, propose a clear animated interface, then build a solid site with a database and an admin area so you stay in control of your content."),B("Ajoutez ici votre parcours, vos formations et vos expériences : ce texte est entièrement modifiable depuis l’espace admin.","Add your background, training and experience here: this text is fully editable from the admin area.")],
aboutCardsTitle:B("Mes points forts","My strengths"),
aboutStepsTitle:B("Comment je travaille","How I work"),
aboutSteps:[{title:B("Écoute","Listening"),desc:B("Je comprends votre activité, vos objectifs et votre public.","I understand your business, goals and audience.")},{title:B("Conception","Design"),desc:B("Je propose une structure et un style visuel qui vous ressemblent.","I propose a structure and visual style that fit you.")},{title:B("Développement","Development"),desc:B("Je construis le site : pages, animations, base de données et administration.","I build the site: pages, animations, database and admin area.")},{title:B("Livraison & suivi","Delivery & follow-up"),desc:B("Je vous livre un site que vous pouvez modifier vous-même, et je reste disponible.","I deliver a site you can edit yourself, and stay available.")}],
contactTitle:B("Travaillons ensemble","Let’s work together"),
aboutCards:[{title:B("Rapide & fluide","Fast & fluid"),desc:B("Des interfaces animées qui restent légères.","Animated interfaces that stay light.")},{title:B("Sécurisé","Secure"),desc:B("Espaces d’administration protégés et données en base.","Protected admin areas and data kept in a database.")},{title:B("Sur mesure","Tailor-made"),desc:B("Chaque site est pensé pour votre activité.","Each site is designed around your business.")}],
